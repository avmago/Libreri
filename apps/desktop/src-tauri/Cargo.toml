[package]
name = "libreri-desktop"
description = "Libreri desktop app: the thin Tauri shell around the libreri-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "libreri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libreri-core.workspace = true
libreri-library.workspace = true
libreri-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[lints]
workspace = true
