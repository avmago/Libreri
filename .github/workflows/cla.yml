# Contributor licence agreement (CLA.md): the first time someone opens a
# pull request, a bot asks them to sign by commenting; signatures are kept
# in signatures/cla.json on the "cla-signatures" branch.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/avmg0/Libreri/blob/main/CLA.md
          branch: cla-signatures
          allowlist: avmg0,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read the
            [Libreri contributor licence agreement](https://github.com/avmg0/Libreri/blob/main/CLA.md)
            and sign it by commenting with the sentence below. You keep the copyright to your work.
