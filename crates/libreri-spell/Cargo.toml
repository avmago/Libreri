[package]
name = "libreri-spell"
description = "Spell checking with Hunspell dictionaries, word suggestions and completion learned from books and notes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
libreri-helpers.workspace = true
serde.workspace = true
spellbook = "0.4.2"
ureq = "3.4"
# Only the desktop shell turns this on, to generate TypeScript types.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
