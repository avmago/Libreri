[package]
name = "libreri-formats"
description = "Reads metadata, page counts and covers from book files (PDF, EPUB, Markdown, FB2, comics…)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
libreri-core.workspace = true
lopdf = { version = "0.45.0", default-features = false }
quick-xml = "0.42.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
libreri-helpers.workspace = true
unrar = "0.5.8"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
tar = "0.4.46"
serde.workspace = true
serde_json.workspace = true
hayro = "0.7.1"
kurbo = "0.13.0"
png = "0.18.1"
lofty = "0.25.4"
encoding_rs = "0.8"

[dev-dependencies]
lopdf = { version = "0.45.0", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
