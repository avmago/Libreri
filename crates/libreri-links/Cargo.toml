[package]
name = "libreri-links"
description = "Links to web pages and videos: details via oEmbed, offline copies of pages, and the local player page for embedded videos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = "3.4"
url = "2.5"
dom_smoothie = "0.18"
ammonia = "4.2"
regex = "1"
base64 = "0.23"
tiny_http = "0.12.0"
rand_core = { version = "0.6", features = ["getrandom"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[lints]
workspace = true
