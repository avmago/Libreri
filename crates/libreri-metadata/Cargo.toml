[package]
name = "libreri-metadata"
description = "Looks up book details online (Open Library, Google Books, Crossref, OpenAlex, Semantic Scholar, arXiv, ComicVine, ISBNdb) and fetches covers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
libreri-core.workspace = true
libreri-formats.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = "3.4"
# Only the desktop shell turns this on, to generate TypeScript types.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta", "libreri-core/specta"]

[lints]
workspace = true
