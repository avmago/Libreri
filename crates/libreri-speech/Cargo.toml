[package]
name = "libreri-speech"
description = "Speech to text with whisper.cpp: models, audio decoding, transcription and audiobook sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
ureq = "3.4"
whisper-rs = "0.16.0"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
flacenc = "0.5.1"
# Only the desktop shell turns this on, to generate TypeScript types.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
