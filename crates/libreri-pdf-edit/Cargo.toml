[package]
name = "libreri-pdf-edit"
description = "Writes PDFs: marked-up copies now; page edits, redaction and versions in Phase 6b."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "0.45.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "pnm"] }
serde.workspace = true
base64 = "0.23.1"
thiserror.workspace = true
# Only the desktop shell turns this on, to generate TypeScript types.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
libreri-formats.workspace = true

[lints]
workspace = true
