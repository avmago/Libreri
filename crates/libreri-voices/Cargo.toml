[package]
name = "libreri-voices"
description = "Natural voices for reading aloud (Kokoro and Piper), downloaded on request and run on this computer with ONNX Runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
libreri-helpers.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
ndarray = "0.17"
ureq = "3.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
unicode-normalization = "0.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
