[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/libreri-core",
  "crates/libreri-db",
  "crates/libreri-library",
  "crates/libreri-jobs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Libreri contributors"]
# Licence to be decided (see docs/adr/0006-licence-deferred.md)
publish = false

[workspace.dependencies]
libreri-core = { path = "crates/libreri-core" }
libreri-db = { path = "crates/libreri-db" }
libreri-library = { path = "crates/libreri-library" }
libreri-jobs = { path = "crates/libreri-jobs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
