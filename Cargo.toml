[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/libreri-core",
  "crates/libreri-db",
  "crates/libreri-library",
  "crates/libreri-jobs",
  "crates/libreri-formats",
  "crates/libreri-thumbs",
  "crates/libreri-profiles",
  "crates/libreri-metadata",
  "crates/libreri-scan",
  "crates/libreri-export",
  "crates/libreri-helpers",
  "crates/libreri-search",
  "crates/libreri-pdf-edit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Libreri contributors"]
# Licence to be decided (see docs/adr/0006-licence-deferred.md)
publish = false

[workspace.dependencies]
libreri-core = { path = "crates/libreri-core" }
libreri-db = { path = "crates/libreri-db" }
libreri-library = { path = "crates/libreri-library" }
libreri-jobs = { path = "crates/libreri-jobs" }
libreri-formats = { path = "crates/libreri-formats" }
libreri-thumbs = { path = "crates/libreri-thumbs" }
libreri-profiles = { path = "crates/libreri-profiles" }
libreri-metadata = { path = "crates/libreri-metadata" }
libreri-scan = { path = "crates/libreri-scan" }
libreri-export = { path = "crates/libreri-export" }
libreri-helpers = { path = "crates/libreri-helpers" }
libreri-search = { path = "crates/libreri-search" }
libreri-pdf-edit = { path = "crates/libreri-pdf-edit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Image decoding, hashing and PDF parsing are painfully slow unoptimised;
# optimise just these dependencies in debug builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.lopdf]
opt-level = 2
# PIN hashing is deliberately slow; unoptimised it takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
